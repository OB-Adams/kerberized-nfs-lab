# /etc/krb5.conf on every lab host
includedir /etc/krb5.conf.d/

[logging]
    default = FILE:/var/log/krb5libs.log
    kdc = FILE:/var/log/krb5kdc.log
    admin_server = FILE:/var/log/kadmind.log

[libdefaults]
    default_realm = LAB.LOCAL
    # Find KDCs through the SRV records in lab.local; the realm name is fixed here
    dns_lookup_kdc = true
    dns_lookup_realm = false
    # Build service principal names from the name given, not from a PTR lookup
    rdns = false
    dns_canonicalize_hostname = fallback
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true

[realms]
    LAB.LOCAL = {
        admin_server = ldap.lab.local
    }

[domain_realm]
    .lab.local = LAB.LOCAL
    lab.local = LAB.LOCAL
