# /var/kerberos/krb5kdc/kdc.conf on ldap.lab.local (KDC and kadmind only)
[kdcdefaults]
    kdc_ports = 88
    kdc_tcp_ports = 88

[realms]
    LAB.LOCAL = {
        database_module = lab_ldap
        acl_file = /var/kerberos/krb5kdc/kadm5.acl
        key_stash_file = /var/kerberos/krb5kdc/.k5.LAB.LOCAL
        max_life = 24h
        max_renewable_life = 7d
        # Every new principal must pre-authenticate (no offline guessing from AS-REPs)
        default_principal_flags = +preauth
    }

[dbmodules]
    lab_ldap = {
        db_library = kldap
        ldap_kerberos_container_dn = cn=krbcontainer,dc=lab,dc=local
        ldap_kdc_dn = uid=kdc-service,ou=Services,dc=lab,dc=local
        ldap_kadmind_dn = uid=kadmin-service,ou=Services,dc=lab,dc=local
        ldap_service_password_file = /var/kerberos/krb5kdc/ldap.stash
        ldap_servers = ldaps://ldap.lab.local
        ldap_conns_per_server = 5
    }
